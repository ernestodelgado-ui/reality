<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aire AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Comfortaa:wght@600&family=Rubik+Dirt&family=Caveat:wght@700&family=Permanent+Marker&family=Rubik+Glitch&display=swap" rel="stylesheet">
<style>
  :root { --bg:#121214; --fg:#F2F2EE; --accent:#FF00B2;
    --aire:#79F2F4; --tierra:#EFD74F; --agua:#4F8FEF; --fuego:#FF0000; --corazon:#FF00B2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
  #ui { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); }
  .row { display:flex; gap:8px; justify-content:center; align-items:center; pointer-events:auto; flex-wrap:wrap; }
  button { font:inherit; color:var(--fg); background:rgba(20,20,30,.65); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:10px 16px; backdrop-filter:blur(8px); cursor:pointer; }
  button.on { background:var(--corazon); border-color:var(--corazon); color:#fff; }
  #shutter { width:68px; height:68px; padding:0; border:4px solid #fff; background:rgba(255,255,255,.2); }
  #rec { width:52px; height:52px; padding:0; border:3px solid #ff4d4d; background:rgba(255,77,77,.25); }
  #rec.on { background:#ff4d4d; }
  #hint { text-align:center; font-size:14px; opacity:.85; text-shadow:0 1px 4px #000; pointer-events:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; background:var(--bg); text-align:center; padding:24px; z-index:5; }
  #start h1 { margin:0; font-size:2.4rem; font-family:"Rubik Glitch",Impact,sans-serif; font-weight:400; color:var(--corazon); }
  #start p { max-width:32ch; opacity:.8; margin:0; }
  #start button { background:var(--corazon); color:#fff; border:0; font-weight:600; padding:14px 28px; font-size:1.1rem; }
  #msg { font-size:13px; opacity:.7; min-height:1em; }
  #toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); padding:8px 14px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; }
</style>
</head>
<body>
<div id="start">
  <h1>Aire AR</h1>
  <p>Apunta la cámara a tu mano. Junta el pulgar con el índice y dibuja en el aire.</p>
  <button id="go">Activar cámara</button>
  <div id="msg"></div>
</div>

<canvas id="out"></canvas>
<div id="toast"></div>

<div id="ui">
  <div class="row" id="modes">
    <button data-mode="luz" class="on">Luz</button>
    <button data-mode="particulas">Partículas</button>
    <button data-mode="desdibujar">Desdibujar</button>
  </div>
  <div class="row" id="pals"></div>
  <div>
    <div id="hint"></div>
    <div class="row" style="margin-top:12px">
      <button id="clear">Borrar</button>
      <button id="rec" aria-label="Grabar video"></button>
      <button id="shutter" aria-label="Foto"></button>
      <button id="flip">Girar cámara</button>
    </div>
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const $ = id => document.getElementById(id);
const out = $("out"), ctx = out.getContext("2d");
const base = document.createElement("canvas"), bctx = base.getContext("2d");
const video = document.createElement("video");
video.playsInline = true; video.muted = true;

let mode = "luz", facing = matchMedia("(pointer:coarse)").matches ? "environment" : "user", landmarker = null, stream = null;
let strokes = [], current = null, particles = [];
const PALS = {
  Bioferia:[[181,86,71],[52,84,62],[217,84,62],[0,100,50],[318,100,50]],
  Aire:    [[181,86,71],[217,84,62],[200,90,80]],
  Tierra:  [[52,84,62],[30,95,55],[0,100,50]],
  Agua:    [[217,84,62],[181,86,71],[235,80,60]],
  Fuego:   [[0,100,50],[20,100,52],[318,100,50]],
  Corazón: [[318,100,50],[330,100,65],[0,100,50]]
};
const PAL_FONT = { Bioferia:"Inter", Aire:"Comfortaa", Tierra:"Rubik Dirt", Agua:"Caveat", Fuego:"Permanent Marker", Corazón:"Rubik Glitch" };
const PAL_DOT = { Bioferia:"linear-gradient(90deg,#79F2F4,#EFD74F,#4F8FEF,#FF0000,#FF00B2)", Aire:"#79F2F4", Tierra:"#EFD74F", Agua:"#4F8FEF", Fuego:"#FF0000", Corazón:"#FF00B2" };
let palName = "Bioferia";
// color de la paleta en fase u (0..1), mezclando suavemente entre paradas
function pc(u, a = 1) {
  const st = PALS[palName], n = st.length;
  u = ((u % 1) + 1) % 1 * n;
  const i = Math.floor(u), f = u - i, A = st[i % n], B = st[(i + 1) % n];
  let dh = B[0] - A[0]; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
  return `hsla(${(A[0] + dh * f + 360) % 360},${A[1] + (B[1] - A[1]) * f}%,${A[2] + (B[2] - A[2]) * f}%,${a})`;
}
const pals = $("pals");
Object.keys(PALS).forEach(n => {
  const b = document.createElement("button"); b.textContent = n; b.style.padding = "6px 12px"; b.style.fontSize = "14px"; b.style.fontFamily = PAL_FONT[n] + ",Inter,sans-serif";
  b.innerHTML = `<i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${PAL_DOT[n]};margin-right:6px"></i>` + n;
  b.classList.toggle("on", n === palName);
  b.onclick = () => { palName = n; [...pals.children].forEach(c => c.classList.toggle("on", c === b)); };
  pals.appendChild(b);
});
let lastVideoTime = -1, hands = [], hue = 180;

const hints = {
  luz: "Junta pulgar e índice para dibujar con luz",
  particulas: "Junta pulgar e índice para soltar partículas",
  desdibujar: "Mueve la mano frente a la cámara: arrastra y mezcla la realidad"
};
function setMode(m) {
  mode = m;
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("hint").textContent = hints[m];
}
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
setMode("luz");

function toast(t) {
  const el = $("toast"); el.textContent = t; el.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.opacity = 0, 1800);
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  out.width = base.width = video.videoWidth;
  out.height = base.height = video.videoHeight;
  strokes = []; current = null; particles = [];
  layer.width = out.width; layer.height = out.height; prevBrush = {};
}

async function initLandmarker() {
  const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = d => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: d },
    runningMode: "VIDEO", numHands: 4
  });
  try { landmarker = await HandLandmarker.createFromOptions(files, opts("GPU")); }
  catch { landmarker = await HandLandmarker.createFromOptions(files, opts("CPU")); }
}

$("go").onclick = async () => {
  $("go").disabled = true; $("msg").textContent = "Cargando…";
  try {
    await startCamera();
    await initLandmarker();
    $("start").style.display = "none";
    requestAnimationFrame(loop);
  } catch (e) {
    $("go").disabled = false;
    $("msg").textContent = "No se pudo iniciar: " + e.message + " (necesita HTTPS o localhost y permiso de cámara)";
  }
};

$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch (e) { toast("No se pudo girar la cámara"); }
};
$("clear").onclick = () => { strokes = []; current = null; particles = []; lctx.clearRect(0, 0, layer.width, layer.height); };

// ---- mapeo de coordenadas (espejo en cámara frontal)
const mirror = () => facing === "user";
const P = (lm) => ({ x: (mirror() ? 1 - lm.x : lm.x) * out.width, y: lm.y * out.height });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function analyze(res) {
  hands = (res.landmarks || []).map(l => {
    const pts = l.map(P);
    const span = dist(pts[0], pts[9]);               // muñeca -> nudillo medio
    const pinch = dist(pts[4], pts[8]) < span * 0.35;
    const open = [8, 12, 16, 20].every(i => dist(pts[i], pts[0]) > span * 1.5);
    return { pts, span, pinch, open, tip: pts[8], palm: { x: (pts[0].x + pts[9].x) / 2, y: (pts[0].y + pts[9].y) / 2 } };
  });
}

function update(t) {
  hue = (hue + 0.6) % 360;
  const pinching = hands.filter(h => h.pinch);

  if (mode === "luz") {
    if (pinching.length) {
      const p = { x: (pinching[0].pts[4].x + pinching[0].tip.x) / 2, y: (pinching[0].pts[4].y + pinching[0].tip.y) / 2 };
      if (!current) { current = { pts: [], t0: t }; strokes.push(current); }
      const last = current.pts[current.pts.length - 1];
      const s = last ? { x: last.x + (p.x - last.x) * 0.5, y: last.y + (p.y - last.y) * 0.5 } : p; // suavizado
      current.pts.push({ ...s, h: hue, t });
    } else current = null;
    strokes.forEach(s => s.pts = s.pts.filter(p => t - p.t < 6000));
    strokes = strokes.filter(s => s.pts.length || s === current);
  }

  if (mode === "particulas") {
    pinching.forEach(h => {
      const p = h.tip;
      for (let i = 0; i < 4; i++) particles.push({
        x: p.x, y: p.y, vx: (Math.random() - .5) * 4, vy: (Math.random() - .5) * 4 - 1,
        life: 1, h: (hue + Math.random() * 90) % 360, r: 2 + Math.random() * 4
      });
    });
    particles.forEach(q => { q.x += q.vx; q.y += q.vy; q.vy += 0.05; q.life -= 0.012; });
    particles = particles.filter(q => q.life > 0);
  }

}

function drawVideoMirrored() {
  bctx.save();
  if (mirror()) { bctx.translate(base.width, 0); bctx.scale(-1, 1); }
  bctx.drawImage(video, 0, 0, base.width, base.height);
  bctx.restore();
  ctx.drawImage(base, 0, 0);
}

const layer = document.createElement("canvas"), lctx = layer.getContext("2d");
const patch = document.createElement("canvas"), pctx = patch.getContext("2d");
let prevBrush = {};
// puntos de la mano que actúan de pincel: [landmark, tamaño relativo]
const BRUSH = [[0,.9],[4,.5],[8,.5],[12,.55],[16,.5],[20,.45],[9,.8]];

// toma un trozo de lo que se ve en (x0,y0), lo gira un poco, lo tiñe con la paleta y lo apoya en (x1,y1) con borde suave
function smear(x0, y0, x1, y1, r, rot) {
  const d = Math.ceil(r * 2);
  patch.width = patch.height = d;
  pctx.save(); pctx.translate(r, r); pctx.rotate(rot); pctx.scale(1.03, 1.03);
  pctx.drawImage(out, x0 - r, y0 - r, d, d, -r, -r, d, d);
  pctx.restore();
  pctx.globalCompositeOperation = "overlay";
  pctx.fillStyle = pc(hue / 360 + x1 / out.width * .6 + y1 / out.height * .4, .45);
  pctx.fillRect(0, 0, d, d);
  pctx.globalCompositeOperation = "destination-in";
  const g = pctx.createRadialGradient(r, r, 0, r, r, r);
  g.addColorStop(0, "rgba(0,0,0,.9)"); g.addColorStop(.6, "rgba(0,0,0,.5)"); g.addColorStop(1, "rgba(0,0,0,0)");
  pctx.fillStyle = g; pctx.fillRect(0, 0, d, d);
  pctx.globalCompositeOperation = "source-over";
  lctx.drawImage(patch, x1 - r, y1 - r);
}

function smudge() {
  lctx.globalCompositeOperation = "destination-out";   // la realidad vuelve de a poco
  lctx.fillStyle = "rgba(0,0,0,.03)"; lctx.fillRect(0, 0, layer.width, layer.height);
  lctx.globalCompositeOperation = "source-over";
  if (mode !== "desdibujar") return;
  if (!hands.length) prevBrush = {};
  hands.forEach((h, hi) => BRUSH.forEach(([i, k]) => {
    const p = h.pts[i], key = hi + "_" + i, pr = prevBrush[key], r = Math.max(14, h.span * k * .7);
    if (pr) {
      const dx = p.x - pr.x, dy = p.y - pr.y, dd = Math.hypot(dx, dy);
      if (dd > 3) {
        const n = Math.min(6, Math.ceil(dd / (r * .35)));
        for (let s = 1; s <= n; s++) smear(pr.x + dx * (s - 1) / n, pr.y + dy * (s - 1) / n, pr.x + dx * s / n, pr.y + dy * s / n, r, .04);
      } else smear(p.x, p.y, p.x, p.y, r, .08);   // quieta: revuelve en el lugar
    }
    prevBrush[key] = { x: p.x, y: p.y };
  }));
}

function drawTrails(t) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  strokes.forEach(s => {
    for (let i = 1; i < s.pts.length; i++) {
      const a = s.pts[i - 1], b = s.pts[i];
      const f = 1 - (t - b.t) / 6000;
      ctx.strokeStyle = pc(b.h / 360, f);
      ctx.shadowColor = pc(b.h / 360); ctx.shadowBlur = 20;
      ctx.lineWidth = 3 + 8 * f;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  });
  ctx.shadowBlur = 0;
}

function drawParticles() {
  ctx.globalCompositeOperation = "lighter";
  particles.forEach(q => {
    ctx.fillStyle = pc(q.h / 360, q.life);
    ctx.shadowColor = pc(q.h / 360); ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * q.life, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalCompositeOperation = "source-over"; ctx.shadowBlur = 0;
}

function drawCursors() {
  hands.forEach(h => {
    ctx.fillStyle = h.pinch ? "#fff" : "rgba(255,255,255,.45)";
    ctx.beginPath(); ctx.arc(h.tip.x, h.tip.y, h.pinch ? 9 : 6, 0, Math.PI * 2); ctx.fill();
  });
}

let cursorsVisible = true;
function loop(t) {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  if (video.currentTime !== lastVideoTime && landmarker) {
    lastVideoTime = video.currentTime;
    analyze(landmarker.detectForVideo(video, t));
  }
  update(t);
  drawVideoMirrored();
  ctx.drawImage(layer, 0, 0);
  smudge();
  drawTrails(t);
  drawParticles();
  if (cursorsVisible) drawCursors();
}

// ---- foto y video (se guardan desde el canvas, así incluyen los efectos)
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const stamp = () => new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);

$("shutter").onclick = () => {
  cursorsVisible = false;
  requestAnimationFrame(() => requestAnimationFrame(() => {   // un frame sin cursor
    out.toBlob(b => { download(b, `aire-ar-${stamp()}.png`); toast("Foto guardada"); cursorsVisible = true; }, "image/png");
  }));
};

let recorder = null, chunks = [];
$("rec").onclick = () => {
  if (recorder) { recorder.stop(); return; }
  const types = ["video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const mimeType = types.find(t => MediaRecorder.isTypeSupported(t)) || "";
  recorder = new MediaRecorder(out.captureStream(30), mimeType ? { mimeType } : undefined);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const type = recorder.mimeType || "video/webm";
    download(new Blob(chunks, { type }), `aire-ar-${stamp()}.${type.includes("mp4") ? "mp4" : "webm"}`);
    recorder = null; $("rec").classList.remove("on"); toast("Video guardado");
  };
  recorder.start(); $("rec").classList.add("on"); toast("Grabando…");
};
</script>
</body>
</html>
