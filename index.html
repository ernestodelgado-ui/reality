<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aire AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Comfortaa:wght@600&family=Rubik+Dirt&family=Caveat:wght@700&family=Permanent+Marker&family=Rubik+Glitch&display=swap" rel="stylesheet">
<style>
  :root { --bg:#121214; --fg:#F2F2EE; --corazon:#FF00B2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
  #ui { position:fixed; inset:0; z-index:1; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom)); }
  #ui::before { content:""; position:absolute; left:0; right:0; bottom:0; height:40%; z-index:-1; background:linear-gradient(transparent,rgba(0,0,0,.55)); }
  button { font:inherit; color:var(--fg); background:rgba(20,20,30,.6); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:10px 16px; backdrop-filter:blur(8px); cursor:pointer; pointer-events:auto; }
  .top { display:flex; justify-content:flex-end; }
  .ic { width:44px; height:44px; padding:0; display:grid; place-items:center; }
  #dock { display:flex; flex-direction:column; align-items:center; gap:8px; }
  #hint { font-size:14px; text-shadow:0 1px 4px #000; opacity:.9; transition:opacity .4s; pointer-events:none; text-align:center; }
  #pals { display:flex; gap:2px; }
  .dot { width:44px; height:44px; padding:0; background:none; border:0; backdrop-filter:none; display:grid; place-items:center; }
  .dot i { display:block; width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,.55); transition:.15s; }
  .dot.sel i { width:32px; height:32px; border-color:#fff; box-shadow:0 0 14px rgba(255,255,255,.7); }
  .seg { display:flex; background:rgba(18,18,20,.55); border-radius:999px; padding:3px; backdrop-filter:blur(8px); pointer-events:auto; }
  .seg button { border:0; background:none; padding:8px 20px; font-size:14px; }
  .seg button.on { background:var(--corazon); color:#fff; }
  #actions { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; width:100%; max-width:420px; }
  #clear { justify-self:start; padding:10px 14px; font-size:14px; }
  #rec { justify-self:end; width:52px; height:52px; padding:0; border:3px solid #ff4d4d; background:rgba(255,77,77,.25); }
  #rec.on { background:#ff4d4d; }
  #shutter { width:70px; height:70px; padding:0; border:4px solid #fff; background:rgba(255,255,255,.2); }
  #start { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; background:var(--bg); text-align:center; padding:24px; }
  #start h1 { margin:0; font-size:2.4rem; font-family:"Rubik Glitch",Impact,sans-serif; font-weight:400; color:var(--corazon); }
  #start p { max-width:32ch; opacity:.8; margin:0; }
  #start button { background:var(--corazon); color:#fff; border:0; font-weight:600; padding:14px 28px; font-size:1.1rem; }
  #msg { font-size:13px; opacity:.7; min-height:1em; }
  #err { position:fixed; z-index:9; left:12px; right:12px; top:12px; display:none; background:#7a0020; color:#fff; padding:10px 14px; border-radius:12px; font-size:13px; word-break:break-word; }
  #toast { position:fixed; z-index:2; top:70px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.65); padding:8px 16px; border-radius:999px; font-size:18px; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
</style>
</head>
<body>
<div id="start">
  <h1>Aire AR</h1>
  <p>Apunta la cámara y pasa la mano: donde la tocas, la realidad se quiebra como un prisma y se llena de color.</p>
  <button id="go">Activar cámara</button>
  <div id="msg"></div>
</div>

<canvas id="out"></canvas>
<div id="toast"></div>
<div id="err"></div>

<div id="ui">
  <div class="top">
    <button id="flip" class="ic" aria-label="Girar cámara">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>
  <div id="dock">
    <div id="hint"></div>
    <div id="pals"></div>
    <div class="seg" id="modes">
      <button data-mode="desdibujar" class="on">Desdibujar</button>
      <button data-mode="luz">Luz</button>
    </div>
    <div id="actions">
      <button id="clear">Borrar</button>
      <button id="shutter" aria-label="Foto"></button>
      <button id="rec" aria-label="Grabar video"></button>
    </div>
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const $ = id => document.getElementById(id);
const out = $("out"), ctx = out.getContext("2d");
const video = document.createElement("video");
video.playsInline = true; video.muted = true; video.setAttribute("playsinline", "");
video.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none"; document.body.appendChild(video);
const showErr = m => { $("err").textContent = m; $("err").style.display = "block"; };
addEventListener("error", e => showErr("Error: " + e.message));
addEventListener("unhandledrejection", e => showErr("Error: " + (e.reason && e.reason.message || e.reason)));
const ANDROID = /Android/i.test(navigator.userAgent);
if (/FBAN|FBAV|Instagram|WhatsApp|; wv\)/i.test(navigator.userAgent)) $("msg").textContent = "Estás en el navegador de otra app: abrí este link en Chrome o Safari para que ande la cámara.";

let mode = "desdibujar", facing = matchMedia("(pointer:coarse)").matches ? "environment" : "user", landmarker = null, stream = null;
let strokes = [], current = null;

// ---- paletas Bioferia
const PALS = {
  Bioferia:[[181,86,71],[52,84,62],[217,84,62],[0,100,50],[318,100,50]],
  Aire:    [[181,86,71],[217,84,62],[200,90,80]],
  Tierra:  [[52,84,62],[30,95,55],[0,100,50]],
  Agua:    [[217,84,62],[181,86,71],[235,80,60]],
  Fuego:   [[0,100,50],[20,100,52],[318,100,50]],
  Corazón: [[318,100,50],[330,100,65],[0,100,50]]
};
const PAL_FONT = { Bioferia:"Inter", Aire:"Comfortaa", Tierra:"Rubik Dirt", Agua:"Caveat", Fuego:"Permanent Marker", Corazón:"Rubik Glitch" };
const PAL_DOT = { Bioferia:"conic-gradient(#79F2F4,#EFD74F,#4F8FEF,#FF0000,#FF00B2,#79F2F4)", Aire:"#79F2F4", Tierra:"#EFD74F", Agua:"#4F8FEF", Fuego:"#FF0000", Corazón:"#FF00B2" };
let palName = "Bioferia";

// color de la paleta en fase u (0..1), mezclando suavemente entre paradas
function palHSL(u) {
  const st = PALS[palName], n = st.length;
  u = ((u % 1) + 1) % 1 * n;
  const i = Math.floor(u), f = u - i, A = st[i % n], B = st[(i + 1) % n];
  let dh = B[0] - A[0]; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
  return [(A[0] + dh * f + 360) % 360, A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f];
}
function pc(u, a = 1) { const [h, s, l] = palHSL(u); return `hsla(${h},${s}%,${l}%,${a})`; }
function palRGB(u) {
  const [h, s0, l0] = palHSL(u), s = s0 / 100, l = l0 / 100, a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}

const pals = $("pals");
Object.keys(PALS).forEach(n => {
  const b = document.createElement("button"); b.className = "dot"; b.setAttribute("aria-label", n);
  b.innerHTML = `<i style="background:${PAL_DOT[n]}"></i>`;
  b.classList.toggle("sel", n === palName);
  b.onclick = () => {
    palName = n; [...pals.children].forEach(c => c.classList.toggle("sel", c === b));
    toast(n, PAL_FONT[n]);
  };
  pals.appendChild(b);
});
let lastVideoTime = -1, hands = [], hue = 180;

const hints = {
  desdibujar: "Pasa la mano frente a la cámara",
  luz: "Junta pulgar e índice y dibuja en el aire"
};
function setMode(m) {
  mode = m; prevBrush = {};
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("hint").textContent = hints[m];
}
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

function toast(t, font) {
  const el = $("toast"); el.textContent = t; el.style.fontFamily = (font ? font + "," : "") + "Inter,sans-serif"; el.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.opacity = 0, 1400);
}

// ---- suavizado del seguimiento (filtro One Euro): quita el temblor sin atrasar el movimiento rápido
class OneEuro {
  constructor(minCut = 1.5, beta = 8, dCut = 1) { Object.assign(this, { minCut, beta, dCut, t: null, x: 0, dx: 0 }); }
  a(c, dt) { return 1 / (1 + 1 / (2 * Math.PI * c) / dt); }
  f(x, t) {
    if (this.t == null) { this.t = t; this.x = x; return x; }
    const dt = Math.max(t - this.t, 1e-3); this.t = t;
    this.dx += this.a(this.dCut, dt) * ((x - this.x) / dt - this.dx);
    this.x += this.a(this.minCut + this.beta * Math.abs(this.dx), dt) * (x - this.x);
    return this.x;
  }
}
let filters = [];

// ---- fluido (WebGL2): lo que se mueve empuja y tiñe un campo que deforma la cámara
const glc = document.createElement("canvas");
const gl = glc.getContext("webgl2", { alpha: false, antialias: false });
let fluid = false, P = {}, vel, dye, pres, div, curl, vtex, velTexel = [1, 1];
const FORCE = 1800, CURL = 0, VEL_DISS = 3.5, DYE_DISS = 2.4, ITER = 10;

function initFluid() {
  if (!gl || !(gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float"))) return false;
  const VS = `#version 300 es
in vec2 aPos; out vec2 vUv,vL,vR,vT,vB; uniform vec2 uTexel;
void main(){vUv=aPos*.5+.5;vL=vUv-vec2(uTexel.x,0.);vR=vUv+vec2(uTexel.x,0.);vT=vUv+vec2(0.,uTexel.y);vB=vUv-vec2(0.,uTexel.y);gl_Position=vec4(aPos,0.,1.);}`;
  const H = `#version 300 es
precision highp float;precision highp sampler2D;in vec2 vUv,vL,vR,vT,vB;out vec4 o;uniform vec2 uTexel;\n`;
  const prog = fs => {
    const p = gl.createProgram();
    [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, H + fs]].forEach(([t, src]) => {
      const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    });
    gl.bindAttribLocation(p, 0, "aPos"); gl.linkProgram(p);
    const u = {}; for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
    return { p, u };
  };
  try {
    P = {
      splat: prog(`uniform sampler2D uT;uniform float uAsp,uRad,uA;uniform vec2 uPt;uniform vec3 uCol;
void main(){vec2 p=vUv-uPt;p.x*=uAsp;float g=exp(-dot(p,p)/uRad);vec4 t=texture(uT,vUv);o=vec4(t.rgb+g*uCol,min(t.a+g*uA,1.));}`),
      adv: prog(`uniform sampler2D uVel,uSrc;uniform float uDt,uDiss;
void main(){vec2 c=vUv-uDt*texture(uVel,vUv).xy*uTexel;o=texture(uSrc,c)/(1.+uDiss*uDt);}`),
      curl: prog(`uniform sampler2D uVel;
void main(){float L=texture(uVel,vL).y,R=texture(uVel,vR).y,T=texture(uVel,vT).x,B=texture(uVel,vB).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}`),
      vort: prog(`uniform sampler2D uVel,uCurl;uniform float uAmt,uDt;
void main(){float L=texture(uCurl,vL).x,R=texture(uCurl,vR).x,T=texture(uCurl,vT).x,B=texture(uCurl,vB).x,C=texture(uCurl,vUv).x;
vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=uAmt*C;f.y*=-1.;
o=vec4(clamp(texture(uVel,vUv).xy+f*uDt,-1000.,1000.),0.,1.);}`),
      div: prog(`uniform sampler2D uVel;
void main(){float L=texture(uVel,vL).x,R=texture(uVel,vR).x,T=texture(uVel,vT).y,B=texture(uVel,vB).y;vec2 C=texture(uVel,vUv).xy;
if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}`),
      scale: prog(`uniform sampler2D uT;uniform float uV;void main(){o=uV*texture(uT,vUv);}`),
      pres: prog(`uniform sampler2D uP,uDiv;
void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;o=vec4((L+R+B+T-texture(uDiv,vUv).x)*.25,0.,0.,1.);}`),
      grad: prog(`uniform sampler2D uP,uVel;
void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;o=vec4(texture(uVel,vUv).xy-vec2(R-L,T-B),0.,1.);}`),
      disp: prog(`uniform sampler2D uVideo,uVel,uDye;uniform float uMir,uTime;
vec2 mu(vec2 s){s=1.-abs(1.-mod(s,2.));return vec2(mix(s.x,1.-s.x,uMir),s.y);}
void main(){
  vec4 d=texture(uDye,vUv);
  float m=smoothstep(.08,.6,d.a), z=clamp(d.a*5.,0.,1.);
  vec2 g=vec2(texture(uDye,vR).a-texture(uDye,vL).a,texture(uDye,vT).a-texture(uDye,vB).a);
  vec2 w=vec2(sin(vUv.y*6.+uTime*.9),cos(vUv.x*6.-uTime*.8))*.008*m;
  vec2 st=vUv+clamp(-g*.7*m+vec2(-g.y,g.x)*.5*m+w,-.035,.035);
  vec3 cam=vec3(texture(uVideo,mu(st+g*.25*z)).r,texture(uVideo,mu(st)).g,texture(uVideo,mu(st-g*.25*z)).b);
  vec3 dc=d.rgb/max(max(d.r,max(d.g,d.b)),1e-3);
  vec3 col=mix(cam,cam*(.9+.3*dc),m*.1);
  float e=clamp(length(g)*4.,0.,1.)*z;
  col+=dc*e*.22+vec3(pow(clamp(dot(normalize(g+1e-5),vec2(.6,.8)),0.,1.)*e,2.))*.12;
  o=vec4(col,1.);
}`)
    };
  } catch (e) { console.error(e); return false; }
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  vtex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, vtex);
  [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([k, v]) => gl.texParameteri(gl.TEXTURE_2D, k, v));
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  return true;
}

function fbo(w, h) {
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([k, v]) => gl.texParameteri(gl.TEXTURE_2D, k, v));
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fbo: f, w, h, ok: gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE };
}
const dbl = (w, h) => { const d = { read: fbo(w, h), write: fbo(w, h), swap() { [this.read, this.write] = [this.write, this.read]; } }; return d; };

// las grillas siguen la proporción de la cámara
function resizeFluid() {
  if (!gl) return;
  glc.width = out.width; glc.height = out.height;
  const a = out.width / out.height, grid = s => a >= 1 ? [Math.round(s * a), s] : [s, Math.round(s / a)];
  const [vw, vh] = grid(128), [dw, dh] = grid(512);
  velTexel = [1 / vw, 1 / vh];
  vel = dbl(vw, vh); dye = dbl(dw, dh); pres = dbl(vw, vh); div = fbo(vw, vh); curl = fbo(vw, vh);
  fluid = [vel.read, dye.read, pres.read, div, curl].every(f => f.ok);
  if (!fluid) toast("Este celular no soporta el efecto de fluido");
}
function clearFluid() {
  if (!fluid) return;
  [vel, dye, pres].forEach(d => [d.read, d.write].forEach(f => { gl.bindFramebuffer(gl.FRAMEBUFFER, f.fbo); gl.clear(gl.COLOR_BUFFER_BIT); }));
}

function draw(pr, vals, texs, target) {
  gl.useProgram(pr.p);
  gl.uniform2f(pr.u.uTexel, velTexel[0], velTexel[1]);
  for (const k in vals) {
    const v = vals[k]; if (!pr.u[k]) continue;
    if (typeof v === "number") gl.uniform1f(pr.u[k], v); else if (v.length === 2) gl.uniform2f(pr.u[k], v[0], v[1]); else gl.uniform3f(pr.u[k], v[0], v[1], v[2]);
  }
  Object.entries(texs || {}).forEach(([k, t], i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(pr.u[k], i); });
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
  gl.viewport(0, 0, target ? target.w : glc.width, target ? target.h : glc.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// empuja (dx,dy en píxeles de la imagen) y tiñe con `col` en el punto (x,y)
function splat(x, y, dx, dy, col, rad, a) {
  const W = out.width, H = out.height, m = W * .05;
  const vals = { uAsp: W / H, uRad: rad, uPt: [x / W, 1 - y / H] };
  draw(P.splat, { ...vals, uA: 0, uCol: [Math.max(-m, Math.min(m, dx)) / W * FORCE, -Math.max(-m, Math.min(m, dy)) / H * FORCE, 0] }, { uT: vel.read.tex }, vel.write); vel.swap();
  draw(P.splat, { ...vals, uA: a, uCol: col }, { uT: dye.read.tex }, dye.write); dye.swap();
}

function stepFluid(dt) {
  draw(P.curl, {}, { uVel: vel.read.tex }, curl);
  draw(P.vort, { uAmt: CURL, uDt: dt }, { uVel: vel.read.tex, uCurl: curl.tex }, vel.write); vel.swap();
  draw(P.div, {}, { uVel: vel.read.tex }, div);
  draw(P.scale, { uV: .8 }, { uT: pres.read.tex }, pres.write); pres.swap();
  for (let i = 0; i < ITER; i++) { draw(P.pres, {}, { uP: pres.read.tex, uDiv: div.tex }, pres.write); pres.swap(); }
  draw(P.grad, {}, { uP: pres.read.tex, uVel: vel.read.tex }, vel.write); vel.swap();
  draw(P.adv, { uDt: dt, uDiss: VEL_DISS }, { uVel: vel.read.tex, uSrc: vel.read.tex }, vel.write); vel.swap();
  draw(P.adv, { uDt: dt, uDiss: DYE_DISS }, { uVel: vel.read.tex, uSrc: dye.read.tex }, dye.write); dye.swap();
}

// cada punto de la mano empuja el fluido según cuánto se movió
const BRUSH = [[0, .9], [4, .5], [8, .5], [12, .55], [16, .5], [20, .45]];
let prevBrush = {};
function brushHands() {
  if (!hands.length) prevBrush = {};
  hands.forEach((h, hi) => BRUSH.forEach(([i, k], bi) => {
    const p = h.pts[i], key = hi + "_" + i, pr = prevBrush[key];
    prevBrush[key] = { x: p.x, y: p.y };
    if (!pr) return;
    const dx = p.x - pr.x, dy = p.y - pr.y, sp = Math.hypot(dx / out.width, dy / out.height);
    if (sp < .0015) return;
    const amt = Math.min(1, Math.max(.2, sp * 40)), rad = Math.min(.004, Math.max(.0006, .22 * (k * h.span / out.width) ** 2));
    splat(p.x, p.y, dx, dy, palRGB(hue / 360 + bi * .17 + p.x / out.width * .4).map(v => v * amt * .2), rad, amt * .22);
  }));
}

function renderFluid(dt) {
  if (!fluid) return drawVideoMirrored();
  if (mode === "desdibujar") brushHands();
  stepFluid(dt);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, vtex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
  draw(P.disp, { uMir: mirror() ? 1 : 0, uTime: performance.now() / 1000 }, { uVideo: vtex, uVel: vel.read.tex, uDye: dye.read.tex }, null);
  ctx.drawImage(glc, 0, 0);
}

function drawVideoMirrored() {
  ctx.save();
  if (mirror()) { ctx.translate(out.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, out.width, out.height);
  ctx.restore();
}

// ---- cámara y manos
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  out.width = video.videoWidth; out.height = video.videoHeight;
  strokes = []; current = null; prevBrush = {}; filters = [];
  resizeFluid();
}

let visionFiles = null, delegate = "", recovering = false;
const lmOpts = d => ({
  baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: d },
  runningMode: "VIDEO", numHands: 4
});
async function makeLandmarker(d) {
  visionFiles ||= await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(visionFiles, lmOpts(d)); delegate = d;
}
// en Android el modo GPU falla seguido: arranca directo en CPU
async function initLandmarker() {
  try { await makeLandmarker(ANDROID ? "CPU" : "GPU"); } catch { await makeLandmarker("CPU"); }
}

$("go").onclick = async () => {
  $("go").disabled = true; $("msg").textContent = "Cargando…";
  try {
    initFluidOnce();
    await startCamera();
    await initLandmarker();
    $("start").style.display = "none";
    requestAnimationFrame(loop);
  } catch (e) {
    $("go").disabled = false;
    $("msg").textContent = "No se pudo iniciar (" + (e.name || "error") + "): " + e.message + " (necesita HTTPS o localhost y permiso de cámara)";
  }
};
let fluidInit = false;
function initFluidOnce() { if (!fluidInit) { fluidInit = true; if (!initFluid()) { gl && console.warn("sin fluido"); } } }

$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch (e) { toast("No se pudo girar la cámara"); }
};
$("clear").onclick = () => { strokes = []; current = null; clearFluid(); };

// ---- mapeo de coordenadas (espejo en cámara frontal)
const mirror = () => facing === "user";
const P2 = (lm, x, y) => ({ x: (mirror() ? 1 - x : x) * out.width, y: y * out.height });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function analyze(res, t) {
  const lms = res.landmarks || [];
  filters.length = lms.length;
  hands = lms.map((l, hi) => {
    const fs = filters[hi] || (filters[hi] = l.map(() => [new OneEuro(), new OneEuro()]));
    const pts = l.map((lm, i) => P2(lm, fs[i][0].f(lm.x, t), fs[i][1].f(lm.y, t)));
    const span = dist(pts[0], pts[9]);               // muñeca -> nudillo medio
    const pinch = dist(pts[4], pts[8]) < span * 0.35;
    const open = [8, 12, 16, 20].every(i => dist(pts[i], pts[0]) > span * 1.5);
    return { pts, span, pinch, open, tip: pts[8], palm: { x: (pts[0].x + pts[9].x) / 2, y: (pts[0].y + pts[9].y) / 2 } };
  });
}

function update(t) {
  hue = (hue + 0.6) % 360;
  if (mode !== "luz") { current = null; return; }
  const pinching = hands.filter(h => h.pinch);
  if (pinching.length) {
    const p = { x: (pinching[0].pts[4].x + pinching[0].tip.x) / 2, y: (pinching[0].pts[4].y + pinching[0].tip.y) / 2 };
    if (!current) { current = { pts: [], t0: t }; strokes.push(current); }
    const last = current.pts[current.pts.length - 1];
    const s = last ? { x: last.x + (p.x - last.x) * 0.5, y: last.y + (p.y - last.y) * 0.5 } : p; // suavizado
    current.pts.push({ ...s, h: hue, t });
  } else current = null;
  strokes.forEach(s => s.pts = s.pts.filter(p => t - p.t < 6000));
  strokes = strokes.filter(s => s.pts.length || s === current);
}

function drawTrails(t) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  strokes.forEach(s => {
    for (let i = 1; i < s.pts.length; i++) {
      const a = s.pts[i - 1], b = s.pts[i];
      const f = 1 - (t - b.t) / 6000;
      ctx.strokeStyle = pc(b.h / 360, f);
      ctx.shadowColor = pc(b.h / 360); ctx.shadowBlur = 20;
      ctx.lineWidth = 3 + 8 * f;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  });
  ctx.shadowBlur = 0;
}

function drawCursors() {
  hands.forEach(h => {
    ctx.fillStyle = h.pinch ? "#fff" : "rgba(255,255,255,.45)";
    ctx.beginPath(); ctx.arc(h.tip.x, h.tip.y, h.pinch ? 9 : 6, 0, Math.PI * 2); ctx.fill();
  });
}

let cursorsVisible = true, lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  const dt = Math.min((t - lastT) / 1000 || .016, .05); lastT = t;
  if (video.currentTime !== lastVideoTime && landmarker) {
    lastVideoTime = video.currentTime;
    try { analyze(landmarker.detectForVideo(video, t), t / 1000); }
    catch (e) {
      if (delegate === "GPU" && !recovering) { recovering = true; landmarker = null; makeLandmarker("CPU").catch(er => showErr("Manos: " + er.message)).finally(() => recovering = false); }
      else showErr("Manos: " + e.message);
    }
  }
  update(t);
  renderFluid(dt);
  drawTrails(t);
  if (cursorsVisible && mode === "luz") drawCursors();
  $("hint").style.opacity = hands.length ? 0 : .9;
}
setMode("desdibujar");

// ---- foto y video (se guardan desde el canvas, así incluyen los efectos)
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const stamp = () => new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);

$("shutter").onclick = () => {
  cursorsVisible = false;
  requestAnimationFrame(() => requestAnimationFrame(() => {   // un frame sin cursor
    out.toBlob(b => { download(b, `aire-ar-${stamp()}.png`); toast("Foto guardada"); cursorsVisible = true; }, "image/png");
  }));
};

let recorder = null, chunks = [];
$("rec").onclick = () => {
  if (recorder) { recorder.stop(); return; }
  const types = ["video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const mimeType = types.find(t => MediaRecorder.isTypeSupported(t)) || "";
  recorder = new MediaRecorder(out.captureStream(30), mimeType ? { mimeType } : undefined);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const type = recorder.mimeType || "video/webm";
    download(new Blob(chunks, { type }), `aire-ar-${stamp()}.${type.includes("mp4") ? "mp4" : "webm"}`);
    recorder = null; $("rec").classList.remove("on"); toast("Video guardado");
  };
  recorder.start(); $("rec").classList.add("on"); toast("Grabando…");
};
</script>
</body>
